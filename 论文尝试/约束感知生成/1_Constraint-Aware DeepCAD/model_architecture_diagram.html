<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constraint-Aware DeepCAD — Model Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0f14;
    --card-bg: #181b24;
    --text: #e4e6ed;
    --text-dim: #7d819a;
    --blue: #4e94e6;
    --blue-light: #72b4ff;
    --red: #e8504f;
    --red-light: #ff7a7a;
    --red-glow: rgba(232,80,79,0.18);
    --green: #48c774;
    --orange: #eda94e;
    --purple: #a07de8;
    --arrow: #555b78;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3','Noto Sans SC', sans-serif;
    display: flex;
    justify-content: center;
    padding: 30px 10px 60px;
  }

  .wrap { width: 1080px; }

  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
    background: linear-gradient(135deg,var(--blue-light),var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:12px; font-weight:300; }

  .legend {
    display:flex; justify-content:center; gap:30px;
    margin-bottom: 24px; font-size:13px;
  }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:14px; height:14px; border-radius:3px; border:2px solid; }
  .dot.orig { border-color:var(--blue); background:rgba(78,148,230,.12); }
  .dot.new  { border-color:var(--red);  background:var(--red-glow); }

  svg { display:block; margin:0 auto; }

  /* text classes */
  .t  { font-family:'Source Sans 3','Noto Sans SC',sans-serif; fill:var(--text); }
  .td { fill:var(--text-dim); }
  .tm { font-family:'JetBrains Mono',monospace; }
  .tr { fill:var(--red-light); }
  .tb { fill:var(--blue-light); }
  .tg { fill:var(--green); }
  .to { fill:var(--orange); }
  .tp { fill:var(--purple); }

  /* blocks */
  .bk { rx:7; ry:7; stroke-width:2; }
  .bo { fill:rgba(78,148,230,.07); stroke:var(--blue); }
  .bn { fill:var(--red-glow); stroke:var(--red); filter:url(#glow); }
  .bg { fill:rgba(72,199,116,.08); stroke:var(--green); }
  .bgn{ fill:var(--red-glow); stroke:var(--red); filter:url(#glow); }
  .bl { fill:rgba(237,169,78,.08); stroke:var(--orange); }
  .bln{ fill:var(--red-glow); stroke:var(--red); filter:url(#glow); }
  .bp { fill:rgba(160,125,232,.1); stroke:var(--purple); }

  /* sub blocks inside decoder layer */
  .sb  { rx:5; ry:5; stroke-width:1.5; }
  .sbo { fill:rgba(78,148,230,.1); stroke:rgba(78,148,230,.5); }
  .sbn { fill:rgba(232,80,79,.08); stroke:rgba(232,80,79,.55); filter:url(#glow); }

  /* group dashed box */
  .gb { rx:10; ry:10; stroke-width:1.4; stroke-dasharray:7 5; fill:none; }
  .gbo{ stroke:rgba(78,148,230,.28); }
  .gbn{ stroke:rgba(232,80,79,.35); }

  /* arrows */
  .ar  { stroke:var(--arrow); stroke-width:2; fill:none; }
  .arn { stroke:var(--red); stroke-width:2; fill:none; }
  .ard { stroke-dasharray:6 4; }

  /* badge */
  .badge-bg { fill:var(--red); rx:3; ry:3; }
  .badge-tx { font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:central; }

  /* bracket */
  .brk { stroke:var(--text-dim); stroke-width:1; fill:none; stroke-dasharray:4 3; }
</style>
</head>
